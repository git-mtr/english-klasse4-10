    }

      margin-top: 1em;
      font-size: 1.1em;
    }

    .all-options label {
      margin: 0 1em;

      min-width: 230px;
      padding: 0.7em 1.2em;
      font-family: Verdana, sans-serif;
      font-size: 1em;
      color: #222;
      background-color: #ffd54f;
      border: none;

</head>

  <div class="container">

    <h1>Englisch lernen</h1>

    <div class="radio-group" id="directionGroup">

        <input

          value="en-de"

        >
        🇬🇧 Englisch → Deutsch
      </label>

      <label>
        <input
          type="radio"
          name="direction"
          value="de-en"

        >
        🇩🇪 Deutsch → Englisch
      </label>

    </div>


    <div class="radio-group">

        id="topicSelect"

        <option value="begruessung">Begrüßung</option>

        <option value="nahrung">Nahrung</option>

        <option value="allgemein">Allgemein</option>
        <option value="adjektive">Adjektive</option>
        <option value="tiere">Tiere</option>
      </select>

      <div id="allOptions" class="all-options">
        <label>
          <input type="checkbox" id="randomEnglish" checked onchange="resetAllRandom()">

        </label>

        <label>
          <input type="checkbox" id="randomGerman" checked onchange="resetAllRandom()">
          🇩🇪 Deutsch
        </label>
      </div>

    </div>


    <div
      class="song-text"
      id="songText"
    >
      Lade Inhalt...
    </div>


    <div
      class="feedback"
      id="feedbackArea"
    ></div>


    <div>

      <button
        class="back-btn"
        onclick="prevWord()"
      >
        ⬅️ Zurück
      </button>

      <button
        class="check-btn"
        onclick="checkTranslation()"

        Übersetzung anzeigen
      </button>

      <button
        class="next-btn"
        onclick="nextWord()"

        Nächster ➡️

/*
 * Aktuelles Array bestimmen
 */

function getCurrentArray() {

  const topic =
    document.getElementById(
      "topicSelect"
    ).value;

  if (topic === "all") {
    return Object.values(topics).flat();
  }

  return topics[topic];

}


/*
 * Übersetzungsrichtung bestimmen
 */

function getDirection() {

  return document.querySelector(
    'input[name="direction"]:checked'
  ).value;

}


/*
 * Zufälligen Eintrag für All erzeugen

    document.getElementById("randomGerman").checked;

  }

  const word =
    allWords[Math.floor(Math.random() * allWords.length)];

  let language;

  if (englishChecked && germanChecked) {
    language = Math.random() < 0.5 ? "en" : "de";
  } else if (englishChecked) {
    language = "en";
  } else {
    language = "de";
  }

  return {
    word: word,
    language: language
  };

}


/*
 * Zufälligen All-Eintrag zur Historie hinzufügen
 */

function addRandomAllEntry() {

  const entry = createRandomAllEntry();

  if (!entry) {
    document.getElementById(
      "songText"
    ).innerText = "Bitte Englisch und/oder Deutsch auswählen.";

    document.getElementById(
      "feedbackArea"
    ).innerText = "";

    return false;
  }

  if (allHistoryIndex < allHistory.length - 1) {
    allHistory = allHistory.slice(0, allHistoryIndex + 1);
  }

  allHistory.push(entry);
  allHistoryIndex = allHistory.length - 1;

  return true;

}


/*
 * Aktuellen Eintrag anzeigen
 */

function showCurrentWord() {

  const topic =
    document.getElementById("topicSelect").value;

  if (topic === "all") {

    if (allHistoryIndex < 0) {
      if (!addRandomAllEntry()) {
        return;
      }
    }

    const entry = allHistory[allHistoryIndex];

    document.getElementById(
      "songText"
    ).innerText =
      entry.language === "en"
        ? entry.word.en
        : entry.word.de;

    return;
  }

  const currentArray = getCurrentArray();
  const word = currentArray[currentWordIndex];

  document.getElementById(
    "songText"
  ).innerText =
    getDirection() === "en-de"
      ? word.en
      : word.de;

}


/*
 * Thema wechseln
 */

function changeTopic() {

  currentWordIndex = 0;
  allHistory = [];
  allHistoryIndex = -1;

  const isAll =
    document.getElementById("topicSelect").value === "all";

  document.getElementById(
    "allOptions"
  ).style.display = isAll ? "block" : "none";

  document.getElementById(
    "directionGroup"
  ).style.display = isAll ? "none" : "block";

  document.getElementById(
    "feedbackArea"
  ).innerText = "";

  showCurrentWord();

}


/*
 * All-Zufall nach Änderung einer Checkbox zurücksetzen
 */

function resetAllRandom() {

  allHistory = [];
  allHistoryIndex = -1;

  document.getElementById(
    "feedbackArea"
  ).innerText = "";

  showCurrentWord();

}


/*
 * Anzeige zurücksetzen
 */

function resetUI() {

  currentWordIndex = 0;

  document.getElementById(
    "feedbackArea"
  ).innerText = "";

  showCurrentWord();

}


/*
 * Nächster Eintrag
 */

function nextWord() {

  const topic =
    document.getElementById("topicSelect").value;

  if (topic === "all") {

    if (allHistoryIndex < allHistory.length - 1) {
      allHistoryIndex++;
    } else {
      if (!addRandomAllEntry()) {
        return;
      }
    }

    showCurrentWord();

    document.getElementById(
      "feedbackArea"
    ).innerText = "";

    return;
  }

  const currentArray = getCurrentArray();

  currentWordIndex =
    (currentWordIndex + 1)
    % currentArray.length;

  showCurrentWord();

  document.getElementById(
    "feedbackArea"
  ).innerText = "";

}


/*
 * Vorheriger Eintrag
 */

function prevWord() {

  const topic =
    document.getElementById("topicSelect").value;

  if (topic === "all") {

    if (allHistoryIndex > 0) {
      allHistoryIndex--;
      showCurrentWord();
    }

    document.getElementById(
      "feedbackArea"
    ).innerText = "";

    return;
  }

  const currentArray = getCurrentArray();

  currentWordIndex =
    (
      currentWordIndex
      - 1
      + currentArray.length
    )
    % currentArray.length;

  showCurrentWord();

  document.getElementById(
    "feedbackArea"
  ).innerText = "";

}


/*
 * Übersetzung anzeigen
 */

function checkTranslation() {

  const topic =
    document.getElementById("topicSelect").value;

  if (topic === "all") {

    if (allHistoryIndex < 0) {
      return;
    }

    const entry = allHistory[allHistoryIndex];

    document.getElementById(
      "feedbackArea"
    ).innerText =
      entry.language === "en"
        ? entry.word.de
        : entry.word.en;

    return;
  }

  const currentArray = getCurrentArray();
  const word = currentArray[currentWordIndex];
  const direction = getDirection();

  document.getElementById(
    "feedbackArea"
  ).innerText =
    direction === "en-de"
      ? word.de
      : word.en;

}


/*
 * Initialisieren
 */

changeTopic();

</script>
